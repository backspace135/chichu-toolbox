name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: 构建、静态检查与 JVM 单测
        run: bash ./gradlew :app:assembleDebug :app:assembleRelease lint testDebugUnitTest --no-daemon
      - name: 核验压缩 APK 的启动与 JNI 入口
        run: python3 scripts/verify-apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chichu-toolbox-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
